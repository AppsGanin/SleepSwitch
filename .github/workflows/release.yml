name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза, например v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Определить версию
        id: v
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG"            >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}"    >> "$GITHUB_OUTPUT"

      - name: Собрать установщик
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: ./make-installer.sh

      - name: Упаковать .app отдельно
        run: |
          ditto -c -k --keepParent build/SleepSwitch.app \
            "dist/SleepSwitch-${{ steps.v.outputs.version }}.zip"

      - name: Написать описание релиза
        run: ./Tools/release-notes.sh "${{ steps.v.outputs.version }}" > release-notes.md

      - name: Создать релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" \
            dist/*.pkg dist/*.zip \
            --title "SleepSwitch ${{ steps.v.outputs.version }}" \
            --notes-file release-notes.md
