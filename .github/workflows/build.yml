name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  installer:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tests
        run: ./Tools/run-tests.sh

      - name: Build the installer
        run: ./make-installer.sh

      - name: Inspect the build
        run: |
          set -e
          echo "Architectures:"
          lipo -archs build/SleepSwitch.app/Contents/MacOS/SleepSwitch
          echo "Signature:"
          codesign --verify --strict --verbose=2 build/SleepSwitch.app
          echo "Installer choices, Russian:"
          installer -pkginfo -pkg dist/*.pkg -AppleLanguages '(ru)'
          echo "Installer choices, English:"
          installer -pkginfo -pkg dist/*.pkg -AppleLanguages '(en)'

      # The runner is a throwaway VM, so the package gets installed for real. The
      # postinstall scripts touch /etc/sudoers.d as root and there is nowhere else to
      # exercise them.
      - name: Install the package and check what it did
        run: |
          set -e
          sudo installer -pkg dist/*.pkg -target /

          test -d /Applications/SleepSwitch.app
          echo "App in place: $(defaults read /Applications/SleepSwitch.app/Contents/Info.plist CFBundleShortVersionString)"

          CONSOLE_USER="$(stat -f%Su /dev/console)"
          echo "Console user: $CONSOLE_USER"

          if [ -f /etc/sudoers.d/sleepswitch ]; then
            echo "The rule was installed; checking it."
            sudo visudo -cf /etc/sudoers.d/sleepswitch
            PERMS="$(stat -f '%Sp %Su:%Sg' /etc/sudoers.d/sleepswitch)"
            echo "Mode and owner: $PERMS"
            [ "$PERMS" = "-r--r----- root:wheel" ]

            # The rule must grant exactly two commands and nothing else.
            ALLOWED="$(sudo grep -c 'NOPASSWD' /etc/sudoers.d/sleepswitch)"
            [ "$ALLOWED" -eq 2 ]
            sudo grep -q "NOPASSWD: /usr/bin/pmset -a disablesleep 0\$" /etc/sudoers.d/sleepswitch
            sudo grep -q "NOPASSWD: /usr/bin/pmset -a disablesleep 1\$" /etc/sudoers.d/sleepswitch

            echo "What the rule grants $CONSOLE_USER:"
            sudo -l -U "$CONSOLE_USER" | grep NOPASSWD
          else
            # Also a valid outcome: postinstall skips the rule when the console user is
            # root or not an administrator. Failing here would be wrong.
            echo "No rule installed — postinstall judged the user unsuitable."
          fi

      - name: Check the uninstall
        run: |
          set -e
          ./uninstall.sh
          test ! -d /Applications/SleepSwitch.app
          test ! -f /etc/sudoers.d/sleepswitch
          test -z "$(pkgutil --pkgs | grep sleepswitch || true)"
          echo "Clean removal: app, rule and receipts are all gone."

      - uses: actions/upload-artifact@v4
        with:
          name: SleepSwitch-installer
          path: dist/*.pkg
          if-no-files-found: error
